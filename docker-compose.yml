# Сервер: PostgreSQL, API и клиент за обратным прокси Caddy (TLS).
# Запуск: cp .env.example .env, заполнить значения, затем docker compose up -d --build.
# Для разработки на Windows не нужен: тесты поднимают PostgreSQL через embedded-postgres.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # С PostgreSQL 18 образ хранит данные в /var/lib/postgresql/<версия>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Разовая служба перед API: миграции служебной ролью, затем роль входа API (член alpi_app).
  # Образ — стадия сборки API: в ней всё рабочее пространство вместе с packages/db.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    command: ["node", "packages/db/src/cli/migrate.ts"]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  # API ходит в базу ролью входа приложения, не служебной: иначе row-level security не действует.
  # При другой роли API не запустится (проверка при старте, apps/api/src/index.ts).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${APP_DB_USER}:${APP_DB_PASSWORD}@db:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Ключ шифрования секретов адресов событий (тикет crm-api/06); пусто — адреса событий
      # недоступны. WEBHOOK_ALLOW_INSECURE_URLS сюда не передаётся: она только для тестов.
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY:-}
      # Файлы пользователей — на своём томе: переживают пересборку образа.
      STORAGE_DIR: /data/files
    volumes:
      - files:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  files:
  caddy_data:
  caddy_config:
